<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProTask Board</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>📋 ProTask Board</h1>

  <div class="task-form">

    <input
      type="text"
      id="task-input"
      placeholder="Enter a task"
    >

    <button id="add-btn">
      Add Task
    </button>

  </div>

  <div class="board">

    <div class="column">

      <h2>To Do</h2>

      <div id="todo-tasks"></div>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
