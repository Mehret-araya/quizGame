<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz & Reaction Game Hub</title>
    <link rel="stylesheet" href="dad.css">
</head>
<body class="light-theme">

    <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>

    <!-- Main Menu Screen -->
    <div id="menu-screen">
        <h1>Game Hub</h1>
        <p>Choose a game to play:</p>
        <button onclick="openQuiz('classic')">Classic Quiz</button>
        <button onclick="openQuiz('survival')">Survival Mode (1 Life)</button>
        <button onclick="openReaction()">Reaction Test</button>
        <button onclick="openMemoryGame()">Memory Match</button>
        <button onclick="showLeaderboard()">🏆 Leaderboard</button>
    </div>

    <!-- Quiz Setup Screen -->
    <div id="start-screen" class="hidden">
        <h1>Quiz Settings</h1>
        <div style="margin-bottom: 20px;">
            <label for="quiz-type">Category:</label>
            <select id="quiz-type">
                <option value="general">General Knowledge</option>
                <option value="math">Mathematics</option>
                <option value="computer">Computer Science</option>
                <option value="geography">Geography</option>
                <option value="science">Science</option>
                <option value="api">Random API Questions 🌐</option>
            </select>
            <br><br>
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty">
                <option value="easy">Easy (2 Questions)</option>
                <option value="medium">Medium (3 Questions)</option>
                <option value="hard">Hard (All Questions)</option>
            </select>
        </div>
        <button id="start-btn">Start Quiz</button>
    </div>

    <!-- Active Quiz Screen -->
    <div id="quiz-screen" class="hidden">
        <div id="timer">⏱ Time: 10</div>
        <div id="progress">Question 1 / X</div>
        <h2 id="question">Question text appears here</h2>
        <div id="options"></div>
        <div id="nav-buttons">
            <button id="prev-btn">Previous</button>
            <button id="next-btn">Next</button>
        </div>
        <button onclick="backToMenuFromQuiz()" style="background: #dc3545; margin-top: 20px; width: 80%;">Quit Quiz</button>
    </div>

    <!-- Results Screen -->
    <div id="result-screen" class="hidden"></div>

    <!-- Leaderboard Screen -->
    <div id="leaderboard-screen" class="hidden">
        <h2>🏆 Top Scores</h2>
        <div id="leaderboard-list"></div>
        <button onclick="backToMenuFromLeaderboard()">Back</button>
    </div>

    <!-- Reaction Game Screen -->
    <div id="reaction-screen" class="hidden">
        <h1>Reaction Timer</h1>
        <p id="reaction-text">Wait for Green...</p>
        <button id="reaction-btn">WAIT...</button>
        <p id="reaction-result"></p>
        <button onclick="backToMenu()">Back to Menu</button>
    </div>

    <!-- Memory Match Screen -->
    <div id="memory-screen" class="hidden">
        <h1>Memory Match</h1>
        <p>Find the pairs!</p>
        <div id="memory-grid" class="memory-grid"></div>
        <button onclick="backToMenuFromMemory()" style="margin-top: 20px;">Back to Menu</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
