<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Image</title>
</head>
<body>

<h1>🖼️ Random Image</h1>

<img id="img" width="300"><br><br>

<button onclick="getDog()">New Image</button>

<script>
function getDog() {
  fetch("https://dog.ceo/api/breeds/image/random")
    .then(res => res.json())
    .then(data => {
      document.getElementById("img").src = data.message;
    })
    .catch(error => console.log(error));
}
</script>

</body>
</html>
